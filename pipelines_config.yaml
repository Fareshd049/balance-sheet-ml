pipelines:
  active: "inference"   # later you can add "training", "deployment", etc.

data:
  zip_path: "data/raw/companyfacts.zip"
  extract_dir: "data/raw/companyfacts"          # extracted JSONs go here
  output_dir: "data/processed/companyfacts_long" # partitioned parquet dataset

  # for quick tests set max_files to 50 or 100, for full run keep 0
  max_files: 0

  # parquet chunk size written per company (keeps memory stable)
  chunk_rows: 250000

  include_taxonomies: ["us-gaap"]

features:
  long_dataset_dir: "data/processed/companyfacts_long"
  out_path: "data/interim/balance_sheet_wide.parquet"
  unit_keep: "USD"
  forms_keep: ["10-K", "10-Q", "10-K/A", "10-Q/A"]
  min_end: "1980-01-01"

model_base:
  wide_path: "data/interim/balance_sheet_wide.parquet"
  out_path: "data/interim/balance_sheet_model_base.parquet"
  min_obs_per_company: 4

training:
  dataset_path: "data/interim/balance_sheet_model_with_ratios.parquet"

  # Multi-target
  target_cols:
    - "y_Assets"
    - "y_Liabilities"
    - "y_StockholdersEquity"
    - "y_AssetsCurrent"
    - "y_LiabilitiesCurrent"
    - "y_CashAndCashEquivalentsAtCarryingValue"


  # (Optional) groupings for reporting
  target_groups:
    core:
      - "y_Assets"
      - "y_Liabilities"
      - "y_StockholdersEquity"


  # (Optional) weights - not used yet unless we add weighted aggregation in eval
  target_weights:
    y_Assets: 1.0
    y_Liabilities: 1.0
    y_StockholdersEquity: 1.0
    y_AssetsCurrent: 0.6
    y_LiabilitiesCurrent: 0.6
    y_CashAndCashEquivalentsAtCarryingValue: 0.4

  n_test: 2
  n_val: 1
  max_iter: 900
  learning_rate: 0.03
  max_depth: 6
  early_stopping: true
  n_iter_no_change: 20
  validation_fraction: 0.1
  alpha: 1.0




ratios:
  dataset_path: "data/interim/balance_sheet_model_base.parquet"
  out_path: "data/interim/balance_sheet_model_with_ratios.parquet"



inference:
  # For single_company_json mode:
  dataset_path: null
  json_path: "D:/balance-sheet-ml/CIK0000009999.json"
  models_dir: "data/interim/models"
  out_path: "data/processed/predictions_single.parquet"
  out_scored_path: "data/processed/final_scored_single.parquet"
  mode: "single_company_json"
  delta_mode: "logdiff"
  
  # For latest_per_company mode (batch), use this instead:
  # dataset_path: "data/interim/balance_sheet_model_with_ratios.parquet"
  # json_path: null
  # models_dir: "data/interim/models"
  # out_path: "data/processed/predictions_latest.parquet"
  # out_scored_path: "data/processed/final_scored_latest.parquet"
  # mode: "latest_per_company"
  # delta_mode: "logdiff"